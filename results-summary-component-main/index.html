
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Results Summary Component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="summary-card">

    <section class="result-section">
      <h1>Your Result</h1>

      <div class="score-circle">
        <span class="score">76</span>
        <span class="total">of 100</span>
      </div>

      <h2>Great</h2>

      <p>
        You scored higher than 65% of the people
        who have taken these tests.
      </p>
    </section>

    <section class="summary-section">
      <h2>Summary</h2>

      <div class="summary-item reaction">
        <span>Reaction</span>
        <span><strong>80</strong> / 100</span>
      </div>

      <div class="summary-item memory">
        <span>Memory</span>
        <span><strong>92</strong> / 100</span>
      </div>

      <div class="summary-item verbal">
        <span>Verbal</span>
        <span><strong>61</strong> / 100</span>
      </div>

      <div class="summary-item visual">
        <span>Visual</span>
        <span><strong>72</strong> / 100</span>
      </div>

      <button type="button">Continue</button>
    </section>

  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io/">Frontend Mentor</a>.
    Coded by <a href="#">Your Name</a>.
  </footer>

</body>
</html>
